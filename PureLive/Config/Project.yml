name: PureLive
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.kluoke.purelive
    SWIFT_VERSION: "6.0"
targets:
  PureLive:
    type: application
    platform: iOS
    sources:
      - path: PureLive
    settings:
      base:
        INFOPLIST_FILE: PureLive/Config/AppInfo.plist
        PRODUCT_NAME: Pure Live
    scheme:
      testTargets:
        - PureLiveTests
  PureLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PureLiveTests
    dependencies:
      - target: PureLive
